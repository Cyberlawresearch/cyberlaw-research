</head><body class="research-tool-page"><header class="top"><div class="wrap nav"><div class="site-identity"><a class="brand" href="index.html">科技法研究每日推送</a><span class="site-byline">by学科技法的XinYu</span></div><nav class="navlinks"><a href="favorites.html">我的收藏</a><a href="notes.html">我的笔记</a><a href="archive.html">历史记录</a></nav></div></header><main><section class="tools-shell"><div class="wrap article-wrap"><div class="eyebrow">ACCOUNT</div><h1>账号设置</h1><p class="lead">当前账号：<strong id="account-name"></strong></p><div class="tool-controls"><button id="account-signout" type="button">退出账号</button></div><div class="tool-card account-card"><h2>本机密码设置</h2><p class="tools-note">当前账号密码的修改仅保存在此浏览器，不会自动同步到其他设备。</p><form id="password-form" class="account-form"><label>当前密码<input id="password-current" type="password" autocomplete="current-password" required></label><label>新密码<input id="password-new" type="password" autocomplete="new-password" minlength="6" required></label><label>确认新密码<input id="password-confirm" type="password" autocomplete="new-password" minlength="6" required></label><button type="submit">保存新密码</button></form><p id="password-message" class="account-message" role="status" aria-live="polite"></p></div><div class="tool-card account-card" style="margin-top:16px;min-height:0"><h2>个人资料与备份</h2><p>收藏、摘录、笔记及选题状态保存在当前浏览器。更换设备、浏览器或清除网站数据前，建议先导出资料。</p><p class="tools-note" id="account-storage-summary" role="status"></p><div class="tool-controls"><button id="account-export" type="button">导出全部个人资料（JSON）</button><a href="favorites.html">管理收藏</a><a href="notes.html">管理笔记</a></div><p class="tools-note">导出文件不包含密码或登录凭证。文件仅保存到本机，不上传至服务器。</p><p id="account-export-status" class="tools-note" role="status"></p></div></div></section></main><footer><div class="wrap">科技法研究每日推送 · 账号设置</div></footer></body></html>
