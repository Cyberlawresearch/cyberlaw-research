<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日法学经典</title>
<meta name="description" content="每日推荐并系统解读一部法学经典著作。">
<link rel="stylesheet" href="assets/style.css">
<style>
  .stream-wrap{width:min(860px,calc(100% - 40px));margin:0 auto;padding:72px 0 88px}
  .stream-head{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .stream-head h1{font-size:38px;line-height:1.3;margin:0 0 8px}
  .stream-head p{margin:0;color:var(--muted);font-size:14px}
  .daily-list{display:flex;flex-direction:column}
  .daily-item{display:grid;grid-template-columns:150px 1fr auto;gap:28px;align-items:center;padding:34px 0;border-bottom:1px solid var(--line)}
  .daily-date{font-size:13px;color:var(--muted);line-height:1.7}
  .daily-date strong{display:block;color:var(--ink);font-size:16px;font-weight:600}
  .daily-content h2{font-size:28px;line-height:1.45;margin:0 0 7px;font-weight:600}
  .daily-content p{margin:0;color:var(--muted);font-size:14px}
  .daily-link{display:inline-block;padding:9px 15px;border:1px solid var(--ink);text-decoration:none;white-space:nowrap;font-size:13px;background:var(--panel)}
  .daily-link:hover{background:var(--ink);color:var(--paper)}
  .stream-foot{padding-top:24px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:18px}
  .stream-foot a{text-decoration:none;border-bottom:1px solid var(--line)}
  @media(max-width:720px){
    .stream-wrap{width:min(100% - 32px,860px);padding:46px 0 64px}
    .stream-head h1{font-size:30px}
    .daily-item{grid-template-columns:1fr;gap:12px;padding:28px 0}
    .daily-content h2{font-size:24px}
    .daily-link{justify-self:start}
    .stream-foot{flex-direction:column}
  }
</style>
</head>
<body>
<main class="stream-wrap">
  <header class="stream-head">
    <h1>每日法学经典</h1>
    <p>每天推荐一部值得重读的法学经典，并提供完整解读。</p>
  </header>

  <section class="daily-list" aria-label="每日读物">
    <article class="daily-item">
      <div class="daily-date">
        <strong>2026.08.27</strong>
        ISSUE 001
      </div>
      <div class="daily-content">
        <h2>《普通法》</h2>
        <p>Oliver Wendell Holmes Jr. · The Common Law · 1881</p>
      </div>
      <a class="daily-link" href="articles/2026-08-27-the-common-law.html">进入解读</a>
    </article>
  </section>

  <footer class="stream-foot">
    <span>后续每日更新将按日期由新到旧依次向下排列。</span>
    <a href="archive.html">历史归档</a>
  </footer>
</main>
</body>
</html>
