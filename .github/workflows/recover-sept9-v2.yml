name: 一次性补发2026-09-09-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-sept9-v2.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run corrected recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/recover-sept9.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          embedded = source[start:end]
          lines = []
          changed = False
          for line in embedded.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              if 'block, count = re.subn(r"data-citation=' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  line = indent + """block, count = re.subn(r"data-citation='.*?}'(?=>)", lambda _m: "data-citation='" + safe_json(citation) + "'", block, count=1, flags=re.S)"""
                  changed = True
              lines.append(line)
          assert changed, 'target recovery line not found'
          script = '\n'.join(lines) + '\n'
          exec(compile(script, '<sept9-recovery>', 'exec'), {})
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recover-sept9.yml .github/workflows/recover-sept9-v2.yml
          git add articles/2026-09-09-tech-law-brief.html .github/editions/2026-09-09.json
          git diff --check
          git commit -m "修正并重新核验2026-09-09缺失期"
          git push origin HEAD:main
