name: 每日推送发布保障

# Delivery safeguard for independently published columns.
on:
  schedule:
    - cron: '17,47 20-23,0 * * *'
      timezone: 'Asia/Shanghai'
  workflow_run:
    workflows: ['Deploy static site to Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: daily-edition-release
  cancel-in-progress: false

jobs:
  safeguard:
    if: github.repository == 'Cyberlawresearch/cyberlaw-research' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install structural validator
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Validate independently published columns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-check"
          # Match Pages preparation in this disposable checkout; never commit HTML changes.
          python scripts/current_columns_gate.py --sync-nav 2>&1 | tee "$RUNNER_TEMP/release-check/results.txt"
      - name: Check scheduled news delivery after 22:00
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/release-check/news-delivery.txt"
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now=datetime.now(ZoneInfo('Asia/Shanghai'))
          if not (now.hour >= 22 or now.hour < 1):
              print('News deadline check skipped before 22:00 Asia/Shanghai.')
              raise SystemExit(0)

          day=(now-timedelta(hours=12)).date().isoformat()
          manifest=json.loads(Path('data/current-edition.json').read_text(encoding='utf-8'))
          assert manifest['date'] == max(manifest['page_dates'].values()), 'manifest top-level date is not max(page_dates)'
          assert manifest['page_dates']['brief'] == day, f'brief not published for {day}: {manifest["page_dates"]["brief"]}'
          page=Path(manifest['pages']['brief'])
          assert page.is_file() and day in page.name, f'brief page missing or wrong date: {page}'

          record_path=Path('.github/editions')/f'{day}.news.json'
          assert record_path.is_file(), f'missing news verification record: {record_path}'
          record=json.loads(record_path.read_text(encoding='utf-8'))
          assert record.get('state') == 'verified', 'news verification state is not verified'
          assert record.get('page') == manifest['pages']['brief'], 'news verification page does not match current brief'
          assert record.get('news_count') == manifest['news_count'], 'news count mismatch between record and manifest'
          checks=record.get('checks',{})
          required=(
              'sources','legal_status','original_titles','timeliness',
              'previous_day_event_deduplication','seven_day_history_deduplication',
              'local_language_scan_korea_japan_vietnam','prior_background_checked',
              'natural_chinese_reviewed','background_outlook','foreign_layout'
          )
          missing=[name for name in required if checks.get(name) is not True]
          assert not missing, 'news verification checks incomplete: '+', '.join(missing)
          print(f'News delivery verified for {day}: {manifest["pages"]["brief"]} ({manifest["news_count"]} items).')
          PY
      - name: Verify safeguard schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/Cyberlawresearch/cyberlaw-research/actions/workflows/daily-release.yml --jq .state)" = active
          grep -F "cron: '17,47 20-23,0 * * *'" .github/workflows/daily-release.yml
          grep -F "timezone: 'Asia/Shanghai'" .github/workflows/daily-release.yml
      - name: Close resolved safeguard issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          day=(datetime.now(ZoneInfo('Asia/Shanghai'))-timedelta(hours=12)).date().isoformat()
          marker='<!-- daily-release:'+day+' -->'
          endpoint='repos/Cyberlawresearch/cyberlaw-research/issues'
          rows=json.loads(subprocess.check_output(['gh','api',endpoint+'?state=open&per_page=100'],text=True))
          for row in rows:
              if marker in (row.get('body') or ''):
                  subprocess.run(['gh','api','--method','PATCH',endpoint+'/'+str(row['number']),'-f','state=closed'],check=True)
                  print('Closed resolved safeguard issue #'+str(row['number']))
          PY
      - name: Report safeguard failure outside reader pages
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          day=(datetime.now(ZoneInfo('Asia/Shanghai'))-timedelta(hours=12)).date().isoformat()
          marker='<!-- daily-release:'+day+' -->'
          endpoint='repos/Cyberlawresearch/cyberlaw-research/issues'
          rows=json.loads(subprocess.check_output(['gh','api',endpoint+'?state=open&per_page=100'],text=True))
          if not any(marker in (r.get('body') or '') for r in rows):
              body=marker+'\n@Cyberlawresearch\n\n独立栏目发布保障运行失败；可能是入口/结构验收异常，或22:00后当天新闻尚未完成verified发布。其他栏目未完成不会阻塞新闻，也不会覆盖历史正文。\n\n运行记录：'+os.environ['RUN_URL']
              subprocess.run(['gh','api','--method','POST',endpoint,'-f','title=每日推送发布保障异常｜'+day,'-f','body='+body],check=True)
          PY
      - name: Retain delivery state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-check/
          if-no-files-found: warn
          retention-days: 30
