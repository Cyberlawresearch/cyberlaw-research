name: 每日推送发布保障

# Delivery safeguard for independently published columns.
on:
  schedule:
    - cron: '17,47 20-23,0 * * *'
      timezone: 'Asia/Shanghai'
  workflow_run:
    workflows: ['Deploy static site to Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      edition_date:
        description: 'Optional published news edition to recheck (YYYY-MM-DD); does not publish content'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: daily-edition-release
  cancel-in-progress: false

jobs:
  safeguard:
    if: github.repository == 'Cyberlawresearch/cyberlaw-research' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install structural validator
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Validate independently published columns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-check"
          # Match Pages preparation in this disposable checkout; never commit HTML changes.
          python scripts/current_columns_gate.py --sync-nav 2>&1 | tee "$RUNNER_TEMP/release-check/results.txt"
      - name: Test news delivery safeguard
        run: python scripts/test_news_delivery_gate.py
      - name: Check scheduled news delivery after 22:00
        id: news_delivery
        env:
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-check"
          args=(--result "$RUNNER_TEMP/release-check/news-delivery.json")
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$EDITION_DATE" ]]; then
            args+=(--edition-date "$EDITION_DATE")
          fi
          python scripts/news_delivery_gate.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/release-check/news-delivery.txt"
      - name: Verify safeguard schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/Cyberlawresearch/cyberlaw-research/actions/workflows/daily-release.yml --jq .state)" = active
          grep -F "cron: '17,47 20-23,0 * * *'" .github/workflows/daily-release.yml
          grep -F "timezone: 'Asia/Shanghai'" .github/workflows/daily-release.yml
      - name: Close resolved safeguard issue
        if: success() && steps.news_delivery.outputs.status == 'verified'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/close_daily_release_issue.py "$RUNNER_TEMP/release-check/news-delivery.json"
      - name: Report safeguard failure outside reader pages
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          day=(datetime.now(ZoneInfo('Asia/Shanghai'))-timedelta(hours=12)).date().isoformat()
          requested=os.environ.get('EDITION_DATE', '')
          if requested:
              try:
                  if date.fromisoformat(requested).isoformat() == requested: day=requested
              except ValueError:
                  pass
          marker='<!-- daily-release:'+day+' -->'
          endpoint='repos/Cyberlawresearch/cyberlaw-research/issues'
          rows=json.loads(subprocess.check_output(['gh','api',endpoint+'?state=open&per_page=100'],text=True))
          if not any(marker in (r.get('body') or '') for r in rows):
              body=marker+'\n@Cyberlawresearch\n\n独立栏目发布保障运行失败；可能是入口/结构验收异常，或22:00后当天新闻尚未完成verified发布。其他栏目未完成不会阻塞新闻，也不会覆盖历史正文。\n\n运行记录：'+os.environ['RUN_URL']
              subprocess.run(['gh','api','--method','POST',endpoint,'-f','title=每日推送发布保障异常｜'+day,'-f','body='+body],check=True)
          PY
      - name: Retain delivery state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-check/
          if-no-files-found: warn
          retention-days: 30
