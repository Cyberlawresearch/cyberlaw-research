name: 每日推送发布保障

# This is a delivery/finalization safeguard, NOT the external ChatGPT researcher.
on:
  schedule:
    - cron: '17,47 20-23,0 * * *'
      timezone: 'Asia/Shanghai'
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'papers/**'
      - 'new-works/**'
      - 'data/current-edition.json'
      - '.github/editions/**'
      - '.github/workflows/daily-release.yml'
      - 'scripts/daily_release.py'
      - 'scripts/daily_release_test.py'
      - 'scripts/edition_gate.py'
  workflow_run:
    workflows: ['Deploy static site to Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: daily-edition-release
  cancel-in-progress: false

jobs:
  safeguard:
    if: github.repository == 'Cyberlawresearch/cyberlaw-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install structural validator
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Test release rules without changing user data
        run: python scripts/daily_release_test.py
      - name: Verify workflow is enabled with the intended schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Cyberlawresearch/cyberlaw-research/actions/workflows/daily-release.yml --jq '{id,name,state,path}'
          test "$(gh api repos/Cyberlawresearch/cyberlaw-research/actions/workflows/daily-release.yml --jq .state)" = active
          grep -F "cron: '17,47 20-23,0 * * *'" .github/workflows/daily-release.yml
          grep -F "timezone: 'Asia/Shanghai'" .github/workflows/daily-release.yml
      - name: Complete reviewed content and recover delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/daily_release.py --output "$RUNNER_TEMP/release-check/results.json"
      - name: Report an execution failure outside reader pages
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          day=(datetime.now(ZoneInfo('Asia/Shanghai'))-timedelta(hours=12)).date().isoformat()
          marker='<!-- daily-release:'+day+' -->'
          endpoint='repos/Cyberlawresearch/cyberlaw-research/issues'
          rows=json.loads(subprocess.check_output(['gh','api',endpoint+'?state=open&per_page=100'],text=True))
          if not any(marker in (r.get('body') or '') for r in rows):
              body=marker+'\n@Cyberlawresearch\n\n发布保障运行失败，不能据此认定今日已更新。未强制覆盖历史内容或用户数据。\n\n运行记录：'+os.environ['RUN_URL']
              subprocess.run(['gh','api','--method','POST',endpoint,'-f','title=每日推送未完成｜'+day,'-f','body='+body],check=True)
          PY
      - name: Retain delivery state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-check/
          if-no-files-found: warn
          retention-days: 30
