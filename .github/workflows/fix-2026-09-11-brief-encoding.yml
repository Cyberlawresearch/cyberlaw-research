name: Fix 2026-09-11 brief citation encoding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-2026-09-11-brief-encoding.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-2026-09-11-brief-encoding
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'Cyberlawresearch/cyberlaw-research'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair HTML attribute encoding and rebind verified hashes
        run: |
          python -m pip install beautifulsoup4==4.13.4
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import hashlib, json
          brief=Path('articles/2026-09-11-tech-law-brief.html')
          text=brief.read_text(encoding='utf-8')
          old="EU's cybersecurity agency granted access to Mythos 5 AI model, Commission says"
          assert old in text
          text=text.replace(old,"EU&#39;s cybersecurity agency granted access to Mythos 5 AI model, Commission says")
          brief.write_text(text,encoding='utf-8')
          doc=BeautifulSoup(text,'html.parser')
          items=doc.select('.brief-item')
          assert len(items)==18
          for item in items:
              json.loads(item['data-citation'])
          record_path=Path('.github/editions/2026-09-11.json')
          record=json.loads(record_path.read_text(encoding='utf-8'))
          for p in record['pages'].values():
              record['review']['sha256'][p]=hashlib.sha256(Path(p).read_bytes()).hexdigest()
          record_path.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit repair and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/2026-09-11-tech-law-brief.html .github/editions/2026-09-11.json
          git rm .github/workflows/fix-2026-09-11-brief-encoding.yml
          git commit -m '修复9月11日简报引用属性编码并重新绑定哈希'
          git push origin HEAD:main
