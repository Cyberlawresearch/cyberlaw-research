name: Validate September 9 candidate
on:
  push:
    branches: [automation-sep9-staging]
    paths:
      - 'articles/2026-09-09-*.html'
      - '.github/workflows/validate-sep9-candidate.yml'
permissions:
  contents: write
concurrency:
  group: validate-sep9-candidate
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-sep9-staging
          fetch-depth: 0
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Bind reviewed candidate to final bytes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone
          import hashlib,json
          root=Path('.')
          pages={
            'brief':'articles/2026-09-09-tech-law-brief.html',
            'paper':'articles/2026-09-09-crawford-schultz-big-data-due-process.html',
            'classic':'articles/2026-09-09-beccaria-crimes-punishments.html',
            'newworks':'articles/2026-09-09-new-works.html'}
          docs=[]
          for p in pages.values():
            f=root/p; assert f.is_file(),p
            d=BeautifulSoup(f.read_text(encoding='utf-8'),'html.parser'); docs.append(d)
            assert d.select_one('main h1') and d.select_one('.article-body'),p
            assert d.select_one('.brand').get_text(strip=True)=='网信法研究每日推送',p
            t=d.select_one('main').get_text(' ',strip=True)
            assert 'Cyberlaw Research' not in t and '本期最值得先看' not in t and '占位内容' not in t,p
          news=docs[0].select('.brief-item'); assert len(news)==18,len(news)
          for n in news:
            assert n.get('id') and n.select_one('.brief-fact') and len(n.select_one('.brief-fact').get_text(strip=True))>=65,n.get('id')
            t=n.get_text(' ',strip=True); assert all(x in t for x in ['法治研判','智库选题参考','论文选题']),n.get('id')
            c=json.loads(n['data-citation']); assert c['originalTitle'] and c['url']
          works=docs[3].select('.brief-item'); assert len(works)==5,len(works)
          for w in works:
            c=json.loads(w['data-citation']); assert c['author'] and c['originalTitle'] and c['journal'] and int(c['year'])>=2024
            assert 100<=len(w.select_one('.work-reading').get_text(strip=True))<=260
          lengths=[len(d.select_one('.article-body').get_text(' ',strip=True)) for d in docs]
          assert lengths[1]>=2500,lengths
          assert lengths[2]>=4500 and lengths[2]>=lengths[1]*1.4,lengths
          sha={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in pages.values()}
          event_times={
            'research-item-1':'2026-09-07T19:22:29+08:00','research-item-2':'2026-09-09T15:56:00+08:00','research-item-3':'2026-09-08T17:07:00+08:00','research-item-4':'2026-09-08T14:25:00+08:00','research-item-5':'2026-09-07T10:50:00+08:00','research-item-6':'2026-09-08T19:12:00+08:00','research-item-7':'2026-09-08T19:07:00+00:00','research-item-8':'2026-09-08T19:04:51+00:00','research-item-9':'2026-09-07T10:56:37+00:00','research-item-10':'2026-09-08T11:01:48+00:00','research-item-11':'2026-09-08T08:38:59+00:00','research-item-12':'2026-09-08T00:00:00+01:00','research-item-13':'2026-09-08T18:25:01+00:00','research-item-14':'2026-09-07T08:51:21+00:00','research-item-15':'2026-09-08T18:43:54+00:00','research-item-16':'2026-09-09T01:00:00+10:00','research-item-17':'2026-09-08T04:19:17+00:00','research-item-18':'2026-09-09T00:00:00+01:00'}
          now=datetime.now(timezone.utc).isoformat()
          record={'date':'2026-09-09','pages':pages,'news_count':18,'newworks_count':5,'review':{'status':'verified','checked_at':now,'last_news_scan_at':'2026-09-09T21:00:56+08:00','checks':{'sources':True,'legal_status':True,'bibliography':True,'deduplication':True,'original_titles':True},'sha256':sha,'news_event_times':event_times}}
          out=root/'.github/editions/2026-09-09.json'; out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'lengths':lengths,'sha256':sha},ensure_ascii=False))
          PY
          git diff --check
      - name: Commit hash-bound review record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/editions/2026-09-09.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '核验并绑定2026-09-09四栏正文'
          git push origin HEAD:automation-sep9-staging
