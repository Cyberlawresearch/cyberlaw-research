name: Autonomous global technology law news
on:
  schedule:
    - cron: '15 19,20,21 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-news.yml'
      - 'scripts/autonomous_news_research.py'
      - 'scripts/test_autonomous_news.py'
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: autonomous-tech-law-news
  cancel-in-progress: false
jobs:
  code_checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4==4.13.4'
      - name: Check research script and run offline unit tests
        run: |
          python -m py_compile scripts/autonomous_news_research.py
          python -m unittest discover -s scripts -p 'test_autonomous_news.py' -v
          python scripts/test_publish_news_from_draft.py
  publish:
    if: github.event_name != 'push' && github.repository == 'Cyberlawresearch/cyberlaw-research'
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install news research dependencies
        run: python -m pip install 'openai>=2.0,<4' 'requests>=2.32,<3' 'beautifulsoup4==4.13.4'
      - name: Test the independent researcher and existing publisher
        run: |
          python -m unittest discover -s scripts -p 'test_autonomous_news.py' -v
          python scripts/test_publish_news_from_draft.py
      - name: Check whether today's brief has been published
        id: state
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          day=datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          m=json.load(open('data/current-edition.json',encoding='utf-8'))
          already=m['page_dates']['brief']>=day
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('already='+str(already).lower()+'\n')
              f.write('day='+day+'\n')
          print('Brief currently:',m['page_dates']['brief'],'Today:',day,'Already:',already)
          PY
      - name: Require private API credential
        if: steps.state.outputs.already != 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::Add repository secret OPENAI_API_KEY; ChatGPT subscription does not include API credit.'
            exit 1
          fi
      - name: Independent web research and source verification
        if: steps.state.outputs.already != 'true'
        timeout-minutes: 22
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_RESEARCH_MODEL: gpt-5.4-mini
        run: python scripts/autonomous_news_research.py --out "$RUNNER_TEMP/verified-news.json"
      - name: Atomically publish via existing verified-draft renderer
        if: steps.state.outputs.already != 'true'
        id: write
        shell: bash
        env:
          DAY: ${{ steps.state.outputs.day }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard origin/main
            git clean -fd
            python scripts/publish_news_from_draft.py --draft "$RUNNER_TEMP/verified-news.json"
            git add -- "articles/${DAY}-tech-law-brief.html" \
              ".github/editions/${DAY}.news.json" \
              index.html briefs.html archive.html data/current-edition.json
            if git diff --cached --quiet; then
              echo 'already=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "news: publish ${DAY} source-verified facts (GitHub autonomous)"
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Concurrent main moved; re-rendering on latest main (attempt $attempt)"
          done
          echo '::error::Cannot push safely after three attempts'
          exit 1
      - name: Dispatch real Pages build after GITHUB_TOKEN push
        if: steps.write.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Check actual Pages deployment and live news entrance
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.state.outputs.day }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 55); do
            git fetch --quiet origin main
            headsha="$(git rev-parse origin/main)"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&per_page=12" \
              --jq ".workflow_runs[] | select(.head_sha==\"${headsha}\") | select(.status==\"completed\") | .conclusion" | head -1 || true)"
            if [ "$conclusion" = 'success' ]; then
              manifest="$(curl -fsSL --max-time 15 "https://cyberlawresearch.github.io/cyberlaw-research/data/current-edition.json?t=${GITHUB_RUN_ID}-${attempt}" || true)"
              if printf '%s' "$manifest" | python -c 'import json,sys,os; m=json.load(sys.stdin); assert m["page_dates"]["brief"]==os.environ["DAY"]'; then
                url="https://cyberlawresearch.github.io/cyberlaw-research/articles/${DAY}-tech-law-brief.html"
                if curl -fsSL --max-time 20 -o "$RUNNER_TEMP/deployed-news.html" "$url?t=${GITHUB_RUN_ID}-${attempt}" \
                   && grep -q 'class="brief-item"' "$RUNNER_TEMP/deployed-news.html"; then
                  echo "PASS: deployed $headsha; live news manifest and article match."
                  exit 0
                fi
              fi
            fi
            if [ "$conclusion" = 'failure' ]; then
              echo '::error::Current Pages build failed'
              exit 1
            fi
            sleep 15
          done
          echo '::error::Current news never passed Pages and live-entrance check'
          exit 1
      - name: Open one incident issue when automatic publication fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="自动新闻发布失败｜$(TZ=Asia/Shanghai date +%F)"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if ! gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --title "$title" --body "独立自动新闻任务失败，没有宣称已经发布。查看源头日志：$url"
          fi
