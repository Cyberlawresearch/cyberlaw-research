name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare content structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          groups = [Path('articles'), Path('papers'), Path('new-works')]
          for group in groups:
              if not group.exists():
                  continue
              for path in group.glob('*.html'):
                  text = path.read_text(encoding='utf-8')

                  if 'tech-law-brief' in path.name:
                      text = re.sub(
                          r'<section\b[^>]*class=["\'][^"\']*brief-focus[^"\']*["\'][^>]*>.*?<h2[^>]*>\s*本期最值得先看\s*</h2>.*?</section>',
                          '', text, flags=re.S|re.I
                      )
                      text = re.sub(
                          r'<h2[^>]*>\s*本期最值得先看\s*</h2>\s*<div\b[^>]*class=["\'][^"\']*highlight[^"\']*["\'][^>]*>.*?</div>',
                          '', text, flags=re.S|re.I
                      )

                  text = re.sub(r'<script\b[^>]*src=["\'][^"\']*assets/research-tools\.js["\'][^>]*></script>', '', text, flags=re.I)
                  text = re.sub(r'<script\b[^>]*src=["\'][^"\']*assets/favorites\.js["\'][^>]*></script>', '', text, flags=re.I)
                  text = re.sub(r'<script\b[^>]*src=["\'][^"\']*assets/context-tools\.js["\'][^>]*></script>', '', text, flags=re.I)
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Build research indexes
        run: python scripts/build_research_index.py
      - name: Enable contextual reading tools
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          groups = [Path('articles'), Path('papers'), Path('new-works')]
          tags = (
              '<script defer src="../assets/favorites.js"></script>'
              '<script defer src="../assets/context-tools.js"></script>'
          )
          for group in groups:
              if not group.exists():
                  continue
              for path in group.glob('*.html'):
                  text = path.read_text(encoding='utf-8')
                  if '</head>' in text:
                      text = text.replace('</head>', tags + '</head>', 1)
                      path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
