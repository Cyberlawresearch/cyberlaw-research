name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable text favorites on reading pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          groups = [Path('articles'), Path('papers'), Path('new-works')]
          tag = '<script defer src="../assets/favorites.js"></script>'
          for group in groups:
              if not group.exists():
                  continue
              for path in group.glob('*.html'):
                  text = path.read_text(encoding='utf-8')
                  if 'assets/favorites.js' in text:
                      continue
                  if '</head>' in text:
                      text = text.replace('</head>', tag + '</head>', 1)
                      path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
