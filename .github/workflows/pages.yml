name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare content structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if 'tech-law-brief' in path.name:
                  text = re.sub(r'<section\b[^>]*class=["\'][^"\']*brief-focus[^"\']*["\'][^>]*>.*?<h2[^>]*>\s*本期最值得先看\s*</h2>.*?</section>', '', text, flags=re.S|re.I)
                  text = re.sub(r'<h2[^>]*>\s*本期最值得先看\s*</h2>\s*<div\b[^>]*class=["\'][^"\']*highlight[^"\']*["\'][^>]*>.*?</div>', '', text, flags=re.S|re.I)
              for name in ['research-tools.js','favorites.js','context-tools.js','auth-config.js','auth.js']:
                  text = re.sub(r'<script\b[^>]*src=["\'][^"\']*'+re.escape(name)+r'["\'][^>]*></script>', '', text, flags=re.I)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Build research indexes
        run: python scripts/build_research_index.py
      - name: Enable account access and contextual tools
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reading_dirs = {'articles','papers','new-works'}
          tool_pages = {'search.html','themes.html','ideas.html'}
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or path.name == 'login.html':
                  continue
              depth = len(path.parent.parts)
              prefix = '../' * depth
              auth = f'<script src="{prefix}assets/auth-config.js"></script><script src="{prefix}assets/auth.js"></script>'
              extra = ''
              if path.parent.name in reading_dirs:
                  extra = f'<script defer src="{prefix}assets/favorites.js"></script><script defer src="{prefix}assets/context-tools.js"></script>'
              elif path.name in tool_pages:
                  extra = f'<script defer src="{prefix}assets/research-tools.js"></script>'
              text = path.read_text(encoding='utf-8', errors='ignore')
              if '</head>' in text:
                  text = text.replace('</head>', auth + extra + '</head>', 1)
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
