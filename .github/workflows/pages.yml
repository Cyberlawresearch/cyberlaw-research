name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install edition validator
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Prepare content structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if 'tech-law-brief' in path.name:
                  text = re.sub(r'<section\b[^>]*class=["\'][^"\']*brief-focus[^"\']*["\'][^>]*>.*?<h2[^>]*>\s*本期最值得先看\s*</h2>.*?</section>', '', text, flags=re.S|re.I)
                  text = re.sub(r'<h2[^>]*>\s*本期最值得先看\s*</h2>\s*<div\b[^>]*class=["\'][^"\']*highlight[^"\']*["\'][^>]*>.*?</div>', '', text, flags=re.S|re.I)
              for name in ['research-tools.js','favorites.js','context-tools.js','related-refine.js','context-refine.js','citation-refine.js','notes-inline.js','auth-config.js','auth.js']:
                  text = re.sub(r'<script\b[^>]*src=["\'][^"\']*'+re.escape(name)+r'[^"\']*["\'][^>]*></script>', '', text, flags=re.I)
              path.write_text(text, encoding='utf-8')
          PY
          python scripts/edition_gate.py --sync-nav
      - name: Build research indexes
        run: python scripts/build_research_index.py
      - name: Build factual context index and verify matching rules
        run: |
          python scripts/build_context_index.py
          node scripts/context_rules_test.cjs
      - name: Enable account access and contextual tools
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          reading_dirs = {'articles','papers','new-works'}
          tool_pages = {'search.html','themes.html','ideas.html'}
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or path.name == 'login.html':
                  continue
              depth = len(path.parent.parts)
              prefix = '../' * depth
              auth = f'<script src="{prefix}assets/auth.js?v=4"></script>'
              extra = ''
              if path.parent.name in reading_dirs:
                  extra = f'<script defer src="{prefix}assets/favorites.js?v=4"></script><script defer src="{prefix}assets/context-tools.js?v=3"></script><script defer src="{prefix}assets/context-refine.js?v=5"></script><script defer src="{prefix}assets/citation-refine.js?v=1"></script><script defer src="{prefix}assets/notes-inline.js?v=4"></script>'
              elif path.name in tool_pages:
                  extra = f'<script defer src="{prefix}assets/research-tools.js?v=3"></script>'
              text = path.read_text(encoding='utf-8', errors='ignore')
              if '</head>' in text:
                  text = text.replace('</head>', auth + extra + '</head>', 1)
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Install isolated context test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Validate contextual reading and complete edition before deployment
        shell: bash
        run: |
          python -m http.server 8765 --directory "$GITHUB_WORKSPACE/.." > "$RUNNER_TEMP/context-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 2
          python scripts/context_browser_test.py --base http://localhost:8765/cyberlaw-research/ --output "$RUNNER_TEMP/context-tests/preflight/results.json"
          python scripts/edition_gate.py --base http://localhost:8765/cyberlaw-research/ --output "$RUNNER_TEMP/context-tests/preflight/edition.json"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed contextual reading
        run: python scripts/context_browser_test.py --output "$RUNNER_TEMP/context-tests/deployed/results.json"
      - name: Verify deployed current edition and entry points
        run: python scripts/edition_gate.py --base https://cyberlawresearch.github.io/cyberlaw-research/ --output "$RUNNER_TEMP/context-tests/deployed/edition.json"
      - name: Retain test evidence outside the website
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-tests-${{ github.sha }}
          path: ${{ runner.temp }}/context-tests/
          if-no-files-found: warn
          retention-days: 14
