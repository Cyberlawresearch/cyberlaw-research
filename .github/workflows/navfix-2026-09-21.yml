name: 9月21日当前栏目导航安全同步

on:
  push:
    branches: [main]
    paths:
      - 'articles/2026-09-20-tech-law-brief.html'

permissions:
  contents: write

concurrency:
  group: navfix-2026-09-21
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Change navigation only, preserve news body bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('articles/2026-09-20-tech-law-brief.html')
          text=path.read_text(encoding='utf-8')
          m=re.search(r'<nav class="navlinks">.*?</nav>',text,flags=re.S)
          assert m, 'navigation not found'
          nav=m.group(0)
          nav=nav.replace('2026-09-20-richards-hartzog-taking-trust-seriously.html','2026-09-21-calo-digital-market-manipulation.html')
          nav=nav.replace('2026-09-20-lessig-future-of-ideas.html','2026-09-21-zittrain-future-internet.html')
          nav=nav.replace('2026-09-20-new-works.html','2026-09-21-new-works.html')
          updated=text[:m.start()]+nav+text[m.end():]
          path.write_text(updated,encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- articles/2026-09-20-tech-law-brief.html
          git commit -m '同步9月21日学术三栏导航且保持新闻正文不变'
          git push origin HEAD:main
