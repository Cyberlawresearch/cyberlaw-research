name: Reader tools regression

on:
  workflow_run:
    workflows: ["Deploy static site to Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-regression-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_COMMIT }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test fixtures and the actual deployed pages
        run: python .github/scripts/reader_regression.py --mode all
      - name: Verify mobile header and exact excerpt destination
        run: python .github/scripts/reader_layout.py --mode all
      - name: Retain test results outside reader pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-regression-${{ env.TEST_COMMIT }}
          path: reader-test-results/
          if-no-files-found: warn
          retention-days: 14
