name: 一次性补发2026-09-09

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-sept9.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply ChatGPT-reviewed corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, re

          path = Path('articles/2026-09-09-tech-law-brief.html')
          text = path.read_text(encoding='utf-8')

          def safe_json(data):
              return json.dumps(data, ensure_ascii=False, separators=(',', ':')).replace("'", r'\u0027')

          def replace_article(identity, replacement):
              global text
              pattern = rf'<article class="brief-item" id="research-item-{identity}".*?</article>'
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              assert count == 1, f'cannot replace article {identity}'

          def patch_article(identity, citation, source_url, source_name):
              global text
              pattern = rf'<article class="brief-item" id="research-item-{identity}".*?</article>'
              match = re.search(pattern, text, flags=re.S)
              assert match, f'cannot find article {identity}'
              block = match.group(0)
              block, count = re.subn(r"data-citation='.*?}'(?=>)", "data-citation='" + safe_json(citation) + "'", block, count=1, flags=re.S)
              assert count == 1, f'cannot patch citation {identity}'
              block, count = re.subn(r'<p class="source">原始来源：<a href="[^"]+">[^<]+</a></p>', f'<p class="source">原始来源：<a href="{source_url}">{source_name}</a></p>', block, count=1)
              assert count == 1, f'cannot patch source {identity}'
              text = text[:match.start()] + block + text[match.end():]

          # 2号原候选仅是9月9日转载的旧算力节点事项，改为72小时内的网络法治新进展。
          replace_article(2, '''<article class="brief-item" id="research-item-2" data-event-date="2026-09-08" data-citation='{"originalTitle":"2026年“E法同行 兴辽治宁”全国网络法治主题宣传活动在辽宁沈阳启动","url":"https://www.cac.gov.cn/2026-09/08/c_1790616581404241.htm"}'><h3>2. 全国网络法治主题宣传活动在沈阳启动，聚焦数据安全与未成年人个人信息保护</h3><div class="brief-meta">2026-09-08 · 中国 · 中央网信办、司法部等指导</div><p class="brief-fact">2026年“E法同行 兴辽治宁”全国网络法治主题宣传活动在辽宁沈阳启动，活动由中央网信办、司法部、全国普法办指导。除网络合规经营和依法文明上网外，后续宣讲明确覆盖网络数据安全、未成年人个人信息保护等主题，并结合《个人信息保护法》公布五周年、《数据安全法》施行五周年开展网络法治宣传。</p><p><strong>法治研判：</strong>网络法治宣传正在从一般普法进一步转向数据安全、个人信息保护和平台经营等具体数字场景。其意义不仅在于普及条文，更在于把企业、平台、新就业群体和普通网民分别置于不同的权利义务关系中，推动网络治理规则进入日常经营与使用环节。</p><p><strong>智库选题参考：</strong>《网络法治宣传与数字治理规则落地机制》。可研究个人信息、数据安全和平台合规规则如何通过地方执法、行业培训和公众普法形成稳定的实施反馈。</p><p><strong>论文选题：</strong>《数字法治普法的场景化转型》。可分析网络数据安全和未成年人保护等专业规则如何从抽象规范转化为平台、企业和用户可识别的行为要求。</p><p class="source">原始来源：<a href="https://www.cac.gov.cn/2026-09/08/c_1790616581404241.htm">中国网信网</a></p></article>''')

          # 9号原候选对应的Reuters报道实际发表于9月4日，超出本期72小时门槛，替换为9月9日FTC正式监管动态。
          replace_article(9, '''<article class="brief-item" id="research-item-9" data-event-date="2026-09-09" data-citation='{"originalTitle":"FTC Withdraws Obsolete Policy Statement","url":"https://www.ftc.gov/news-events/news/press-releases/2026/09/ftc-withdraws-obsolete-policy-statement"}'><h3>9. FTC撤销2021年健康应用数据泄露政策声明，2024年修订规则继续覆盖健康应用与连接设备</h3><div class="brief-meta">2026-09-09 · 美国 · Federal Trade Commission</div><p class="brief-fact">美国联邦贸易委员会撤销2021年《关于健康应用和其他连接设备数据泄露的政策声明》。FTC说明，2024年已经修订《健康数据泄露通知规则》，明确覆盖收集消费者健康信息的健康应用和连接设备，因此旧政策声明已无继续保留必要；此次撤销并不意味着相关健康应用退出数据泄露通知规则的适用范围。</p><p><strong>法治研判：</strong>这一调整体现出监管从政策解释转向正式规则文本后的规范清理。对数字健康企业而言，合规判断应回到现行《健康数据泄露通知规则》的主体范围、触发条件和通知义务，而不能把政策声明撤销误读为监管放松。</p><p><strong>智库选题参考：</strong>《数字健康数据泄露规则的美国监管演进》。可比较FTC规则与HIPAA等制度的适用边界，观察健康应用、可穿戴设备等非传统医疗主体如何被纳入数据安全责任体系。</p><p><strong>论文选题：</strong>《从政策声明到正式规则：数字健康数据监管的法源转换》。可讨论行政机关通过解释性文件扩展监管后，何时应以正式规则重构义务边界，以及规范清理对法律确定性的意义。</p><p class="source">原始来源：<a href="https://www.ftc.gov/news-events/news/press-releases/2026/09/ftc-withdraws-obsolete-policy-statement">Federal Trade Commission</a></p></article>''')

          # 核正国内官方文件/报道名称与原始页面。
          patch_article(1, {"originalTitle":"最高人民法院关于依法审理涉人工智能纠纷案件的意见","url":"https://www.court.gov.cn/zixun/xiangqing/511101.html"}, "https://www.court.gov.cn/zixun/xiangqing/511101.html", "最高人民法院")
          patch_article(3, {"originalTitle":"《中国反不正当竞争执法年度报告（2025）》（中英文版）发布","url":"https://www.samr.gov.cn/xw/zj/art/2026/art_5222b01f552d4bcc8e1908779bb6bdc9.html"}, "https://www.samr.gov.cn/xw/zj/art/2026/art_5222b01f552d4bcc8e1908779bb6bdc9.html", "国家市场监督管理总局")
          patch_article(4, {"originalTitle":"打击“缺斤短两”“作弊秤”乱象 市场监管总局在冀浙闽试点加强电子计价秤计量监管","url":"https://www.samr.gov.cn/xw/mtjj/art/2026/art_65fdcedaf0a340d9947a1e429b6bfd69.html"}, "https://www.samr.gov.cn/xw/mtjj/art/2026/art_65fdcedaf0a340d9947a1e429b6bfd69.html", "国家市场监督管理总局")
          patch_article(5, {"originalTitle":"湖北首创公平竞争审查智慧系统大幅提升审查效能","url":"https://www.samr.gov.cn/xw/df/art/2026/art_b10b220692a042b4a8beef05de738764.html"}, "https://www.samr.gov.cn/xw/df/art/2026/art_b10b220692a042b4a8beef05de738764.html", "国家市场监督管理总局")
          patch_article(6, {"originalTitle":"关于《道路机动车辆生产企业及产品公告》（第411批）和《享受车船税减免优惠的节约能源 使用新能源汽车车型目录》（第九十批）拟发布内容的公示","url":"https://wap.miit.gov.cn/jgsj/zbys/qcgy/art/2026/art_c285f020e14b403aba322526ad70d3e9.html"}, "https://wap.miit.gov.cn/jgsj/zbys/qcgy/art/2026/art_c285f020e14b403aba322526ad70d3e9.html", "工业和信息化部")
          text = text.replace('6. 工信部公示车辆准入及新能源汽车税惠目录新一批名单', '6. 工信部公示第411批车辆准入与第90批车船税减免车型目录')
          text = text.replace('并同步公示新能源汽车减免车辆购置税目录相关名单', '并同步公示享受车船税减免优惠的节约能源、使用新能源汽车车型目录相关名单')

          # 核正国外原文标题及原始链接；英文撇号统一写成JSON Unicode转义，避免再次截断HTML属性。
          patch_article(7, {"originalTitle":"US accuses Chinese AI firms of 'malicious' copying of AI technology","url":"https://www.reuters.com/technology/us-accuses-chinese-ai-firms-industrial-scale-theft-ai-technology-2026-09-08/"}, "https://www.reuters.com/technology/us-accuses-chinese-ai-firms-industrial-scale-theft-ai-technology-2026-09-08/", "Reuters")
          patch_article(8, {"originalTitle":"Meta launches AI agent that can access other apps to send emails, make payments","url":"https://www.reuters.com/business/meta-launches-ai-agent-that-can-access-other-apps-send-emails-make-payments-2026-09-08/"}, "https://www.reuters.com/business/meta-launches-ai-agent-that-can-access-other-apps-send-emails-make-payments-2026-09-08/", "Reuters")
          patch_article(10, {"originalTitle":"Google warns of lower quality as it revamps Europe search results to avoid EU fines","url":"https://www.reuters.com/world/google-warns-lower-quality-it-revamps-europe-search-results-avoid-eu-fines-2026-09-08/"}, "https://www.reuters.com/world/google-warns-lower-quality-it-revamps-europe-search-results-avoid-eu-fines-2026-09-08/", "Reuters")
          patch_article(11, {"originalTitle":"My feed, My Way","url":"https://www.pm.gov.au/media/my-feed-my-way"}, "https://www.pm.gov.au/media/my-feed-my-way", "Prime Minister of Australia")
          patch_article(12, {"originalTitle":"Investigation commenced into X under Online Safety Code","url":"https://www.cnam.ie/investigation-commenced-into-x-under-online-safety-code/"}, "https://www.cnam.ie/investigation-commenced-into-x-under-online-safety-code/", "Coimisiún na Meán")
          patch_article(13, {"originalTitle":"Lisa Nandy's statement on protecting children online","url":"https://www.gov.uk/government/speeches/lisa-nandys-statement-on-protecting-children-online"}, "https://www.gov.uk/government/speeches/lisa-nandys-statement-on-protecting-children-online", "UK Government")
          patch_article(14, {"originalTitle":"AI could pose 'existential' risk to humanity, UN rights chief warns","url":"https://www.reuters.com/technology/ai-could-pose-existential-risk-humanity-un-rights-chief-warns-2026-09-07/"}, "https://www.reuters.com/technology/ai-could-pose-existential-risk-humanity-un-rights-chief-warns-2026-09-07/", "Reuters")
          patch_article(15, {"originalTitle":"US FCC proposes to open more spectrum for space-based wireless service","url":"https://www.reuters.com/business/media-telecom/us-fcc-proposes-open-more-wireless-spectrum-space-based-wireless-service-2026-09-08/"}, "https://www.reuters.com/business/media-telecom/us-fcc-proposes-open-more-wireless-spectrum-space-based-wireless-service-2026-09-08/", "Reuters")
          patch_article(16, {"originalTitle":"'Catastrophic' fears: health staff made lists of concerning cases days after Australia's aged care funding tool launch","url":"https://www.theguardian.com/australia-news/2026/sep/09/catastrophic-fears-health-staff-made-lists-of-concerning-cases-days-after-australias-aged-care-funding-tool-launch"}, "https://www.theguardian.com/australia-news/2026/sep/09/catastrophic-fears-health-staff-made-lists-of-concerning-cases-days-after-australias-aged-care-funding-tool-launch", "The Guardian Australia")
          patch_article(17, {"originalTitle":"China's Huawei Technologies faces racketeering trial in New York","url":"https://apnews.com/article/ed66f29aa8539941aa8fad311d511cc2"}, "https://apnews.com/article/ed66f29aa8539941aa8fad311d511cc2", "Associated Press")
          patch_article(18, {"originalTitle":"Ofcom to crack down on spread of illegal intimate images and deepfakes, boosting protections for women and girls online","url":"https://www.ofcom.org.uk/online-safety/illegal-and-harmful-content/ofcom-to-crack-down-on-spread-of-illegal-intimate-images-and-deepfakes-boosting-protections-for-women-and-girls-online"}, "https://www.ofcom.org.uk/online-safety/illegal-and-harmful-content/ofcom-to-crack-down-on-spread-of-illegal-intimate-images-and-deepfakes-boosting-protections-for-women-and-girls-online", "Ofcom")

          # Sanity checks before touching the review record.
          assert text.count('class="brief-item"') == 18
          assert 'research-item-2' in text and 'research-item-9' in text
          assert "data-citation='{\"originalTitle\":\"China's" not in text
          assert '本期最值得先看' not in text
          path.write_text(text, encoding='utf-8')

          record_path = Path('.github/editions/2026-09-09.json')
          record = json.loads(record_path.read_text(encoding='utf-8'))
          assert record['date'] == '2026-09-09'
          record['review']['status'] = 'verified'
          now = datetime.now(timezone.utc).isoformat()
          record['review']['checked_at'] = now
          record['review']['last_news_scan_at'] = now
          record['review']['news_event_times']['research-item-2'] = '2026-09-08T17:01:00+08:00'
          record['review']['news_event_times']['research-item-9'] = '2026-09-09T00:00:00-04:00'
          for page in record['pages'].values():
              record['review']['sha256'][page] = hashlib.sha256(Path(page).read_bytes()).hexdigest()
          record_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recover-sept9.yml
          git add articles/2026-09-09-tech-law-brief.html .github/editions/2026-09-09.json
          git diff --check
          git commit -m "修正并重新核验2026-09-09缺失期"
          git push origin HEAD:main
